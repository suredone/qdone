have_fun: false

memory_config:
  disabled: true

code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: 8
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: true

ignore_patterns:
  - "pnpm-lock.yaml"
  - "npm-shrinkwrap.json"
  - "commonjs/**"
